<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio color and layout review</title><link rel="stylesheet" href="../assets/theme.css"><script type="module" src="./color-review.js"></script>
<style>body{margin:16px;color:var(--ink);background:var(--paper);font:14px/1.5 system-ui}h1{font:26px Georgia,serif}form{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:16px}label{display:grid;gap:4px}select{padding:8px;color:var(--ink);background:var(--raised);border:1px solid var(--muted)}iframe{display:block;border:1px solid var(--line);background:var(--paper)}svg{position:absolute;width:0;height:0;pointer-events:none}.preview{overflow:auto;max-width:100%;padding-bottom:12px}a{color:inherit}p{max-width:900px}</style></head>
<body><h1>Color, state & layout review</h1><p id="simulation-note">Simulations help inspect labels, contrast, and selected/focus states. They supplement browser accessibility checks and human review.</p>
<form><label>View<select id="view"><option value="tower">Assembled tower</option><option value="explore">Expanded tower</option><option value="about">About floor</option><option value="projects">Projects floor</option><option value="projects/b">Systems lab close-up</option><option value="experience">Experience floor</option><option value="resume">Résumé floor</option><option value="contact">Contact floor</option><option value="reading">Complete reading view</option><option value="noscript">No-JavaScript fallback</option></select></label>
<label>Viewport<select id="viewport"><option value="1280x720">Desktop — 1280 × 720</option><option value="390x844">Portrait — 390 × 844</option><option value="650x390">Landscape — 650 × 390</option></select></label>
<label>Color simulation<select id="vision" aria-describedby="simulation-note"><option value="normal">Normal color</option><option value="grayscale">Grayscale</option><option value="protanopia">Protanopia</option><option value="deuteranopia">Deuteranopia</option><option value="tritanopia">Tritanopia</option></select></label></form>
<p id="status" role="status">Loading review…</p><div class="preview"><iframe id="portfolio" title="Portfolio under color review"></iframe></div><svg aria-hidden="true"><defs id="vision-filters"></defs></svg>
<p>Coefficient reference: <a href="https://chromium.googlesource.com/chromium/src/+/HEAD/third_party/blink/renderer/core/css/vision_deficiency.cc">Chromium’s Machado-model color transforms</a>. This page changes only its embedded preview.</p></body></html>
