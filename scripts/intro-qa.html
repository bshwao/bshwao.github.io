<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio intro layout checks</title>
<style>
  *{box-sizing:border-box}body{margin:12px;font:14px/1.5 system-ui;background:#edf3f8;color:#243d40}h1{font-size:18px;margin:0 0 8px}button{min-height:44px;margin:0 6px 8px 0;padding:8px 12px}#stage{overflow:auto}iframe{display:block;box-sizing:content-box;border:1px solid #bac7c7;background:#f4f1e8}pre{white-space:pre-wrap}body.preview{margin:0;width:var(--preview-width);height:var(--preview-height);background:#f4f1e8}body.preview>:not(#stage){display:none}body.preview #stage{overflow:visible;width:var(--preview-width);height:var(--preview-height)}body.preview iframe{border:0}
</style><script type="module" src="./intro-qa.js"></script></head><body>
<h1>Portfolio introduction checks</h1><p id="status" role="status">Running…</p>
<div id="tools"><button data-size="320,568" disabled>Small phone</button><button data-size="390,844" disabled>Portrait</button><button data-size="650,390" disabled>Landscape</button><button data-size="1280,720" disabled>Desktop</button><button id="replay" disabled>Replay intro</button><button id="preview" disabled>Preview only</button><span id="selected"></span></div>
<div id="stage"><iframe id="portfolio" title="Production portfolio introduction" width="390" height="844"></iframe></div>
<details><summary>Layout results</summary><pre id="results"></pre></details>
</body></html>
